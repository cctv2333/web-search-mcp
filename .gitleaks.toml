# gitleaks 自定义规则 —— 继承 gitleaks 默认规则并补充本项目特有模式
# 用法：
#   本地扫描:        gitleaks detect --source . --redact
#   提交前扫描:      gitleaks protect --staged --redact
#   CI 扫描:         gitleaks detect --source . --redact --exit-code 1

title = "通用密钥扫描规则（本地分发的 .gitleaks.toml）"

[extend]
useDefault = true

# DeepSeek API Key（本项目前科所在，重点盯防）
[[rules]]
id = "custom-deepseek-api-key"
description = "DeepSeek API Key"
regex = '''\bsk-[A-Za-z0-9]{20,}\b'''
secretGroup = 0
entropy = 3.5
keywords = ["deepseek"]

# OpenAI API Key
[[rules]]
id = "custom-openai-api-key"
description = "OpenAI API Key"
regex = '''\bsk-(?:proj-)?[A-Za-z0-9_-]{20,}\b'''
secretGroup = 0
entropy = 3.5
keywords = ["openai", "sk-"]

# Anthropic API Key
[[rules]]
id = "custom-anthropic-api-key"
description = "Anthropic API Key"
regex = '''\bsk-ant-[A-Za-z0-9_-]{20,}\b'''
secretGroup = 0
entropy = 3.5
keywords = ["anthropic", "sk-ant-"]

# GitHub Personal Access Token
[[rules]]
id = "custom-github-pat"
description = "GitHub Personal Access Token (ghp_ / github_pat_)"
regex = '''\b(?:ghp_|github_pat_)[A-Za-z0-9_]{30,}\b'''
secretGroup = 0
keywords = ["github", "ghp_", "github_pat_"]

# 配置文件中的密钥赋值：key= 或 key: 形式（覆盖 .env / config.json / yaml）
[[rules]]
id = "custom-key-assignment"
description = "配置文件中的密钥赋值"
regex = '''(?i)(api[_-]?key|secret|token|password|passwd|private[_-]?key)\s*[:=]\s*['"]?[A-Za-z0-9_./+=-]{16,}'''
secretGroup = 0
entropy = 3.0
keywords = ["api_key", "apikey", "api-key", "secret", "token", "password", "private_key"]
